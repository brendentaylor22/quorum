name: Bug report
description: Something behaves differently from what the docs say it does.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems do not belong here — use
        [private vulnerability reporting](https://github.com/brendentaylor22/quorum/security/advisories/new).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a room
        2. Join from a second window as ...
        3. ...
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How are you running Quorum?
      options:
        - npm run dev (local development)
        - Container behind Cloudflare Tunnel
        - Container behind my own reverse proxy
        - Container with no proxy
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or image digest
      description: Output of `quorumctl status`, or the commit you built from.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Quorum redacts capability tokens from its own logs, but check anything you
        paste for invite links, host links, and secrets before posting.
      render: text
