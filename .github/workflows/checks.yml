name: Checks

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Workspace packages export generated declarations; build them before
      # ESLint and tsc resolve @quorum/* from the app workspaces.
      - run: npm run build --workspace @quorum/contracts --workspace @quorum/ranking --workspace @quorum/catalog --workspace @quorum/database
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: npx playwright test --config tests/playwright.config.ts
      - run: npm run audit:prod
      - run: npm run licenses

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Compose topology
        run: QUORUM_IMAGE=quorum:ci docker compose --file deploy/compose.yaml config --quiet
      - name: Validate every Compose profile
        # Ingress and refresh services only appear under a profile, so the
        # default validation above would not have caught a broken one.
        run: |
          QUORUM_IMAGE=quorum:ci docker compose --file deploy/compose.yaml \
            --profile tunnel --profile proxy --profile refresh config --quiet
      - name: Build test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: quorum:ci
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Building and scanning an image says nothing about whether it runs. A
      # missing runtime dependency once shipped a container that exited on
      # startup with every check green.
      - name: Smoke test the built image
        run: scripts/smoke-image.sh quorum:ci
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quorum:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
