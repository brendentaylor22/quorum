name: Release image

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Generate release identity
        id: release
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          printf 'id=main-%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Workspace packages export generated declarations; build them before
      # ESLint and tsc resolve @quorum/* from the app workspaces.
      - run: npm run build --workspace @quorum/contracts --workspace @quorum/ranking --workspace @quorum/catalog --workspace @quorum/database
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:prod
      - run: npm run licenses
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for blocking scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: quorum:release-scan
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block critical and high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quorum:release-scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.id }}
            type=sha,prefix=sha-
            type=raw,value=main
      - name: Publish image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
      # The pre-push scan gates a locally loaded build, not the artifact that
      # operators actually pull. Re-scan the published digest so the release can
      # only complete if the exact deployed image is clean.
      - name: Block critical and high findings in published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SPDX SBOM from published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: quorum-sbom.spdx.json
          upload-artifact: false
      - name: Package pull-only deployment bundle
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          bundle_root="release/quorum-deploy"
          mkdir -p \
            "$bundle_root/deploy/backups" \
            "$bundle_root/deploy/cloudflared" \
            "$bundle_root/deploy/secrets" \
            "$bundle_root/docs" \
            "$bundle_root/scripts"
          cp deploy/compose.yaml "$bundle_root/deploy/compose.yaml"
          cp deploy/cloudflared/config.example.yml "$bundle_root/deploy/cloudflared/config.example.yml"
          cp deploy/secrets/.gitignore "$bundle_root/deploy/secrets/.gitignore"
          cp deploy/secrets/README.md "$bundle_root/deploy/secrets/README.md"
          cp scripts/quorumctl "$bundle_root/scripts/quorumctl"
          chmod 0755 "$bundle_root/scripts/quorumctl"
          cp docs/phase-1/operator-runbook.md "$bundle_root/docs/operator-runbook.md"
          cp docs/phase-1/release-runbook.md "$bundle_root/docs/release-runbook.md"
          cp docs/phase-1/rollback-runbook.md "$bundle_root/docs/rollback-runbook.md"
          printf '# Generated by Quorum release %s\nQUORUM_IMAGE=ghcr.io/%s@%s\nQUORUM_DATA_VOLUME=quorum-data\n' \
            "$RELEASE_ID" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/deploy/.env"
          printf 'release=%s\ncommit=%s\nimage=ghcr.io/%s@%s\n' \
            "$RELEASE_ID" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/RELEASE"
          tar --directory release --create --gzip \
            --file release/quorum-deploy.tar.gz \
            quorum-deploy
          cp quorum-sbom.spdx.json release/quorum-sbom.spdx.json
          (
            cd release
            sha256sum \
              quorum-deploy.tar.gz \
              quorum-sbom.spdx.json \
              > SHA256SUMS
          )
      - name: Upload release evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-release-${{ steps.release.outputs.id }}
          path: |
            release/quorum-deploy.tar.gz
            release/quorum-sbom.spdx.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          assets=(
            "release/quorum-deploy.tar.gz"
            "release/quorum-sbom.spdx.json"
            "release/SHA256SUMS"
          )
          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            gh release upload "$RELEASE_ID" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_ID" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Quorum ${RELEASE_ID}"
          fi
      - name: Record deployment identity
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          printf '### Quorum image\n\n`ghcr.io/%s@%s`\n\nRelease: `%s`\n\nDeployment bundle: `quorum-deploy.tar.gz`.\n' \
            "${{ github.repository }}" \
            "${{ steps.publish.outputs.digest }}" \
            "$RELEASE_ID" \
            >> "$GITHUB_STEP_SUMMARY"
