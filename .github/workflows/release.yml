name: Release image

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify release tag belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # @quorum/database exports generated declarations; build them before ESLint
      # resolves @quorum/database from the API workspace.
      - run: npm run build --workspace @quorum/database
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:prod
      - run: npm run licenses
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build image for blocking scan
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: quorum:release-scan
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Block critical and high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quorum:release-scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image tags
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - name: Publish image
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
      - name: Generate SPDX SBOM from published digest
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: quorum-sbom.spdx.json
          upload-artifact: false
      - name: Package pull-only deployment bundle
        run: |
          set -euo pipefail
          bundle_root="release/quorum-deploy"
          mkdir -p \
            "$bundle_root/deploy/backups" \
            "$bundle_root/deploy/cloudflared" \
            "$bundle_root/deploy/secrets" \
            "$bundle_root/docs" \
            "$bundle_root/scripts"
          cp deploy/compose.yaml "$bundle_root/deploy/compose.yaml"
          cp deploy/cloudflared/config.example.yml "$bundle_root/deploy/cloudflared/config.example.yml"
          cp deploy/backups/.gitignore "$bundle_root/deploy/backups/.gitignore"
          cp deploy/secrets/.gitignore "$bundle_root/deploy/secrets/.gitignore"
          cp deploy/secrets/README.md "$bundle_root/deploy/secrets/README.md"
          cp scripts/quorumctl "$bundle_root/scripts/quorumctl"
          chmod 0755 "$bundle_root/scripts/quorumctl"
          cp docs/phase-1/operator-runbook.md "$bundle_root/docs/operator-runbook.md"
          cp docs/phase-1/release-runbook.md "$bundle_root/docs/release-runbook.md"
          cp docs/phase-1/rollback-runbook.md "$bundle_root/docs/rollback-runbook.md"
          printf '# Generated by Quorum release %s\nQUORUM_IMAGE=ghcr.io/%s@%s\nQUORUM_DATA_VOLUME=quorum-data\n' \
            "$GITHUB_REF_NAME" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/deploy/.env"
          printf 'release=%s\ncommit=%s\nimage=ghcr.io/%s@%s\n' \
            "$GITHUB_REF_NAME" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/RELEASE"
          tar --directory release --create --gzip \
            --file "release/quorum-deploy-${GITHUB_REF_NAME}.tar.gz" \
            quorum-deploy
          cp quorum-sbom.spdx.json "release/quorum-sbom-${GITHUB_REF_NAME}.spdx.json"
          (
            cd release
            sha256sum \
              "quorum-deploy-${GITHUB_REF_NAME}.tar.gz" \
              "quorum-sbom-${GITHUB_REF_NAME}.spdx.json" \
              > SHA256SUMS
          )
      - name: Upload release evidence artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quorum-release-${{ github.ref_name }}
          path: |
            release/quorum-deploy-${{ github.ref_name }}.tar.gz
            release/quorum-sbom-${{ github.ref_name }}.spdx.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release/quorum-deploy-${GITHUB_REF_NAME}.tar.gz"
            "release/quorum-sbom-${GITHUB_REF_NAME}.spdx.json"
            "release/SHA256SUMS"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --generate-notes \
              --title "Quorum ${GITHUB_REF_NAME}"
          fi
      - name: Record deployment identity
        run: |
          printf '### Quorum image\n\n`ghcr.io/%s@%s`\n\nDeployment bundle: `quorum-deploy-%s.tar.gz` attached to GitHub Release.\n' \
            "${{ github.repository }}" \
            "${{ steps.publish.outputs.digest }}" \
            "$GITHUB_REF_NAME" \
            >> "$GITHUB_STEP_SUMMARY"
