name: Release image

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release identity
        id: release
        run: |
          short_sha="${GITHUB_SHA:0:12}"
          printf 'id=main-%s\n' "$short_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Workspace packages export generated declarations; build them before
      # ESLint and tsc resolve @quorum/* from the app workspaces. This list
      # lives in package.json as `build:packages` — enumerating it here as well
      # is how two packages went missing and every type-aware lint rule started
      # reporting `any`.
      - run: npm run build:packages
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Playwright drives the built server and client, so both must exist.
      - run: npm run build
      # A release can be cut by pushing straight to main, which never runs the
      # pull-request checks. The browser suite is the only evidence that the
      # room flow works end to end, so it gates the publish rather than only
      # the review.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: npx playwright test --config tests/playwright.config.ts
      - run: npm run audit:prod
      - run: npm run licenses
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image for blocking scan
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: quorum:release-scan
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Publishing an image that cannot boot is worse than not publishing: it
      # ships with a digest, an SBOM, and a clean scan attesting to it. This
      # runs before the push for exactly that reason.
      - name: Smoke test the image before publishing
        run: scripts/smoke-image.sh quorum:release-scan
      - name: Block critical and high findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: quorum:release-scan
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate immutable image tags
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.release.outputs.id }}
            type=sha,prefix=sha-
            type=raw,value=main
      - name: Publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: VCS_REF=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
      # The pre-push scan gates a locally loaded build, not the artifact that
      # operators actually pull. Re-scan the published digest so the release can
      # only complete if the exact deployed image is clean.
      - name: Block critical and high findings in published digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Generate SPDX SBOM from published digest
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: quorum-sbom.spdx.json
          upload-artifact: false
      - name: Package pull-only deployment bundle
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          bundle_root="release/quorum-deploy"
          mkdir -p \
            "$bundle_root/deploy/backups" \
            "$bundle_root/deploy/cloudflared" \
            "$bundle_root/deploy/caddy" \
            "$bundle_root/deploy/secrets" \
            "$bundle_root/docs" \
            "$bundle_root/scripts"
          cp deploy/compose.yaml "$bundle_root/deploy/compose.yaml"
          cp deploy/cloudflared/config.example.yml "$bundle_root/deploy/cloudflared/config.example.yml"
          cp deploy/caddy/Caddyfile "$bundle_root/deploy/caddy/Caddyfile"
          cp deploy/.env.example "$bundle_root/deploy/.env.example"
          cp deploy/secrets/.gitignore "$bundle_root/deploy/secrets/.gitignore"
          cp deploy/secrets/README.md "$bundle_root/deploy/secrets/README.md"
          cp scripts/quorumctl "$bundle_root/scripts/quorumctl"
          chmod 0755 "$bundle_root/scripts/quorumctl"
          cp docs/operations.md "$bundle_root/docs/operations.md"
          cp docs/releasing.md "$bundle_root/docs/releasing.md"
          # A self-installer gets the guide written for them, plus the licence
          # the AGPL requires travel with every distributed copy.
          cp docs/self-hosting.md "$bundle_root/docs/self-hosting.md"
          cp LICENSE "$bundle_root/LICENSE"
          cp SECURITY.md "$bundle_root/SECURITY.md"
          printf '# Generated by Quorum release %s\nQUORUM_IMAGE=ghcr.io/%s@%s\nQUORUM_DATA_VOLUME=quorum-data\n' \
            "$RELEASE_ID" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/deploy/.env"
          # Carry the commented ingress and tuning options across, so an
          # operator sees them where they will be editing rather than only in
          # the example beside it. Everything above the ingress marker is the
          # image and volume, which the digest pin above has already set.
          sed -n '/^# --- Ingress/,$p' deploy/.env.example >> "$bundle_root/deploy/.env"
          grep -q '^# --- Ingress' deploy/.env.example
          printf 'release=%s\ncommit=%s\nimage=ghcr.io/%s@%s\n' \
            "$RELEASE_ID" \
            "$GITHUB_SHA" \
            "$GITHUB_REPOSITORY" \
            "${{ steps.publish.outputs.digest }}" \
            > "$bundle_root/RELEASE"
          tar --directory release --create --gzip \
            --file release/quorum-deploy.tar.gz \
            quorum-deploy
          cp quorum-sbom.spdx.json release/quorum-sbom.spdx.json
          (
            cd release
            sha256sum \
              quorum-deploy.tar.gz \
              quorum-sbom.spdx.json \
              > SHA256SUMS
          )
      - name: Upload release evidence artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quorum-release-${{ steps.release.outputs.id }}
          path: |
            release/quorum-deploy.tar.gz
            release/quorum-sbom.spdx.json
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with deployment bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          assets=(
            "release/quorum-deploy.tar.gz"
            "release/quorum-sbom.spdx.json"
            "release/SHA256SUMS"
          )
          if gh release view "$RELEASE_ID" >/dev/null 2>&1; then
            gh release upload "$RELEASE_ID" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_ID" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --generate-notes \
              --title "Quorum ${RELEASE_ID}"
          fi
      - name: Record deployment identity
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          printf '### Quorum image\n\n`ghcr.io/%s@%s`\n\nRelease: `%s`\n\nDeployment bundle: `quorum-deploy.tar.gz`.\n' \
            "${{ github.repository }}" \
            "${{ steps.publish.outputs.digest }}" \
            "$RELEASE_ID" \
            >> "$GITHUB_STEP_SUMMARY"
